<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Configurar Trader IA</title><style>body{max-width:560px;margin:40px auto;padding:20px;background:#0b1220;color:#eaf5ff;font:14px Arial}label{display:block;margin:16px 0 6px}input,select{width:100%;padding:11px;border-radius:7px;border:1px solid #345;background:#121e30;color:white}button{margin-top:18px;padding:11px 18px;background:#0aa6d5;color:white;border:0;border-radius:8px;font-weight:bold}small{color:#a9bed1}</style><h2>Trader IA — Configuração</h2><p>Conecte a extensão ao endpoint de análise já hospedado. O token é armazenado no armazenamento local do navegador.</p><label>URL do endpoint</label><input id="apiUrl" value="https://trader-ia-analise-e.hatchable.site/api/analyze"><label>Token de acesso da aplicação</label><input id="apiToken" type="password" autocomplete="off" placeholder="Cole aqui o token de sessão"><label>Período dos candles</label><select id="timeframe"><option>M1</option><option>M5</option><option>M15</option></select><button id="save">Salvar configuração</button><p id="message"><small>Não compartilhe seu token.</small></p><script src="options.js"></script></html>
