name: Tests

on:
  push:
    branches: [main, "audit/fix-tls-and-tests"]
  pull_request:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt pytest
      - run: python -m compileall -q pocketoptionapi_async worker_service.py
      - name: Verify maintained Pocket Option SDK import
        run: python -c "from BinaryOptionsToolsV2.pocketoption import PocketOptionAsync; print('BINARY_OPTIONS_TOOLS_V2_IMPORT_OK')"

  pocketoption-demo-websocket:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Probe Engine.IO and Socket.IO demo handshake (no account credentials)
        run: |
          python - <<'PY'
          import asyncio
          import ssl
          import websockets.legacy.client

          URL = "wss://demo-api-eu.po.market/socket.io/?EIO=4&transport=websocket"

          async def main():
              async with websockets.legacy.client.connect(
                  URL,
                  ssl=ssl.create_default_context(),
                  open_timeout=15,
                  close_timeout=5,
                  ping_interval=None,
                  extra_headers={"Origin": "https://pocketoption.com", "User-Agent": "Mozilla/5.0"},
              ) as ws:
                  packet = await asyncio.wait_for(ws.recv(), timeout=15)
                  print("Engine.IO open packet:", str(packet)[:300])
                  if not str(packet).startswith("0"):
                      raise RuntimeError("Invalid Engine.IO opening packet")
                  await ws.send("40")
                  ack = await asyncio.wait_for(ws.recv(), timeout=15)
                  print("Socket.IO namespace response:", str(ack)[:300])
                  if not str(ack).startswith("40"):
                      raise RuntimeError("Socket.IO namespace was not acknowledged")
                  print("ENGINE_IO_AND_SOCKET_IO_HANDSHAKE_OK")

          asyncio.run(main())
          PY
